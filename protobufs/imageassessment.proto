syntax = "proto3";

message ImageAssessmentRequest {
    string image_path = 1;
    string image_hash = 2;
    bytes image_bytes = 3;
}

message ImageAssessmentResponse {
    string image_path = 1;
    string image_hash = 2;
    double assessment_aesthetic = 3;
    double assessment_technical = 4;
}

service ImageAssessment {
    rpc Assess(ImageAssessmentRequest) returns (ImageAssessmentResponse);
}